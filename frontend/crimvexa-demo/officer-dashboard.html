<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investigation Workspace | CRIMVEXA AI</title>
  <style>
    :root {
      --navy: #0b1120;
      --navy2: #111b33;
      --line: #24345a;
      --ink: #f4f6fb;
      --muted: #a9b6d3;
      --red: #e5484d;
      --paper: #ffffff;
      --text: #172033;
      --soft: #64748b;
      --bg: #f8fafc;
      --focus: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f8fafc;
      color: var(--text);
    }
    a { color: inherit; text-decoration: none; }
    header {
      background: #0b1120;
      color: #fff;
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }
    .brand { font-size: 1.2rem; font-weight: 800; }
    .nav { display: flex; gap: 18px; flex-wrap: wrap; }
    .nav a { color: var(--muted); }
    .nav a:hover { color: #fff; }
    .container { max-width: 1280px; margin: 28px auto; padding: 0 20px 40px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .topbar p { margin: 5px 0 0; color: var(--soft); }
    .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    #refreshStatus { color: var(--soft); font-size: 13px; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .7; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.8rem); }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
    }
    .stat .label { display: block; color: var(--soft); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
    .stat .value { display: block; margin-top: 8px; font-size: 2rem; font-weight: 800; color: var(--navy2); }
    .layout {
      display: grid;
      grid-template-columns: 1.6fr 0.9fr;
      gap: 20px;
    }
    .panel {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 7px 20px rgba(15, 23, 42, 0.04);
    }
    .filters {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    select {
      width: 100%;
      max-width: 220px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
    }
    .case-list { display: flex; flex-direction: column; gap: 12px; }
    .case-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      background: #f8fafc;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .case-card:hover { border-color: #94a3b8; transform: translateY(-1px); }
    .case-card.active { border-color: var(--red); background: #fff5f5; }
    .case-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .case-id { font-weight: 800; }
    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-size: 12px;
      font-weight: 700;
    }
    .tag.high { background: #fee2e2; color: #991b1b; }
    .tag.medium { background: #fef3c7; color: #92400e; }
    .tag.low { background: #dcfce7; color: #166534; }
    .meta { color: var(--soft); font-size: 13px; line-height: 1.7; }
    .detail h2 { margin: 0 0 14px; }
    .detail .key { font-weight: 700; }
    .detail p { color: var(--soft); line-height: 1.8; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-success { background: #dcfce7; color: #166534; }
    .btn-warn { background: #fff7ed; color: #9a5b00; }
    .btn-outline { border-color: #cbd5e1; background: white; color: var(--text); }
    .mini-list { margin: 0; padding-left: 18px; color: var(--soft); line-height: 1.8; }
    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .container { margin-top: 18px; padding-inline: 14px; }
      .stat { padding: 14px; }
      .stat .value { font-size: 1.6rem; }
      .panel { padding: 16px; }
      .topbar-actions { width: 100%; }
      .topbar-actions .btn { flex: 1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">CRIMVEXA AI</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="citizen-dashboard.html">Citizen</a>
      <a href="complaint.html">Report</a>
      <a href="receipt.html">Receipt</a>
    </nav>
  </header>

  <main class="container">
    <div class="topbar">
      <div>
        <h1>Investigation workspace</h1>
        <p id="signedInAs"></p>
      </div>
      <div class="topbar-actions">
        <span id="refreshStatus" role="status" aria-live="polite">Loading cases…</span>
        <button type="button" class="btn btn-outline" id="refreshCases">Refresh cases</button>
        <button type="button" class="btn btn-outline" id="signOut">Sign out</button>
      </div>
    </div>

    <section class="stats">
      <div class="stat"><span class="label">New</span><span class="value" id="countNew">0</span></div>
      <div class="stat"><span class="label">Under review</span><span class="value" id="countReview">0</span></div>
      <div class="stat"><span class="label">Needs details</span><span class="value" id="countInfo">0</span></div>
      <div class="stat"><span class="label">Resolved</span><span class="value" id="countResolved">0</span></div>
    </section>

    <div class="layout">
      <section class="panel">
        <div class="filters">
          <label for="statusFilter" class="key">Filter</label>
          <select id="statusFilter">
            <option value="ALL">All statuses</option>
            <option value="New">New</option>
            <option value="Under Review">Under review</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>
        <div id="caseList" class="case-list"></div>
      </section>

      <aside class="panel detail" id="detailPanel">
        <h2>Select a case</h2>
        <p>No complaint selected yet.</p>
      </aside>
    </div>
  </main>

  <script src="api-client.js"></script>
  <script>
    (async function () {
      const filter = document.getElementById("statusFilter");
      const caseList = document.getElementById("caseList");
      const detailPanel = document.getElementById("detailPanel");
      let cases = [];
      let selected = null;
      let selectedUpdatedAt = null;
      let detailRequest = 0;
      let loading = false;
      const staff = await CrimvexaAPI.requireUser("officer");
      if (!staff) return;
      document.getElementById("signedInAs").textContent =
        `${staff.full_name} · ${staff.role === "admin" ? "Administrator" : "Investigation staff"}`;
      document.getElementById("signOut").addEventListener("click", CrimvexaAPI.logout);

      async function load() {
        if (loading) return;
        loading = true;
        try {
          await refreshCases();
        } finally {
          loading = false;
        }
      }

      async function refreshCases() {
        const refreshStatus = document.getElementById("refreshStatus");
        refreshStatus.textContent = "Refreshing…";
        const stats = await CrimvexaAPI.request("/dashboard/stats");
        document.getElementById("countNew").textContent = stats.by_status.New || 0;
        document.getElementById("countReview").textContent = stats.by_status["Under Review"] || 0;
        document.getElementById("countResolved").textContent = stats.by_status.Resolved || 0;
        const query = filter.value === "ALL"
          ? ""
          : `&status=${encodeURIComponent(filter.value)}`;
        const result = await CrimvexaAPI.request(`/complaints?limit=100${query}`);
        cases = result.complaints;
        document.getElementById("countInfo").textContent =
          cases.filter(item => item.missing_fields && item.missing_fields.length).length;
        renderList();
        const updated = cases.find(item => item.complaint_id === selected);
        if (updated) {
          if (updated.updated_at !== selectedUpdatedAt) await renderDetail(updated);
        } else if (cases.length) {
          selected = cases[0].complaint_id;
          selectedUpdatedAt = null;
          await renderDetail(cases[0]);
        } else {
          selected = null;
          selectedUpdatedAt = null;
          detailPanel.textContent = "No complaints have been submitted.";
        }
        refreshStatus.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
      }

      function showLoadError(error) {
        document.getElementById("refreshStatus").textContent = "Refresh failed";
        caseList.textContent = error.message;
      }

      function renderList() {
        caseList.replaceChildren();
        if (!cases.length) { caseList.textContent = "No cases match the selected filter."; return; }
        cases.forEach(item => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = `case-card${selected === item.complaint_id ? " active" : ""}`;
          const title = document.createElement("strong");
          title.textContent = `${item.complaint_id} · ${item.priority || "Unrated"}`;
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = `${item.reported_category || item.category} · ${item.status} · ${CrimvexaAPI.formatDate(item.created_at)} · ${item.location || "Location not supplied"}`;
          card.append(title, meta);
          card.addEventListener("click", () => {
            selected = item.complaint_id;
            selectedUpdatedAt = null;
            renderList();
            renderDetail(item).catch(error => {
              detailPanel.textContent = error.message;
            });
          });
          caseList.append(card);
        });
      }

      async function renderDetail(item, force = false) {
        const requestId = ++detailRequest;
        const complaintId = item.complaint_id;
        item = await CrimvexaAPI.request(`/complaints/${encodeURIComponent(item.complaint_id)}`);
        if (requestId !== detailRequest || selected !== complaintId) return;
        if (!force && selectedUpdatedAt === item.updated_at) return;
        detailPanel.replaceChildren();
        selectedUpdatedAt = item.updated_at;
        const heading = document.createElement("h2");
        heading.textContent = item.title || item.complaint_id;
        const text = document.createElement("p");
        text.textContent = `${item.complaint_id} · ${item.reporter_name || "Reporter"} · ${item.status} · ${item.priority || "Unrated"} priority\n\n${item.description}`;
        text.style.whiteSpace = "pre-line";
        const location = document.createElement("p");
        location.textContent = `Location: ${item.location || "Not provided"}`;
        const category = document.createElement("p");
        category.textContent = `Suggested category: ${item.category || "Unclassified"} — ${item.category_reason || "No reasoning available"}`;
        const evidence = document.createElement("p");
        evidence.textContent = `Evidence attached: ${(item.evidence || []).length}`;
        const matchesSection = document.createElement("section");
        const matchesHeading = document.createElement("h3");
        matchesHeading.textContent = "Possible related cases";
        matchesSection.append(matchesHeading);
        const matchesList = document.createElement("ul");
        let matches = item.potential_duplicates;
        if (typeof matches === "string") matches = JSON.parse(matches);
        if (matches == null) matches = [];
        if (!Array.isArray(matches)) {
          throw new Error("The server returned invalid potential-match data.");
        }
        if (matches.length) {
          matches.forEach(match => {
            const row = document.createElement("li");
            row.textContent =
              `${match.case_id} · ${match.category || "Unclassified"} · ` +
              `${Math.round(match.similarity * 100)}% text similarity — ${match.summary}`;
            matchesList.append(row);
          });
        } else {
          const row = document.createElement("li");
          row.textContent = "No potential matches above the review threshold.";
          matchesList.append(row);
        }
        const matchNote = document.createElement("p");
        matchNote.textContent = "Similarity is a review aid only; it does not merge or reject cases.";
        matchesSection.append(matchesList, matchNote);
        const assignment = document.createElement("p");
        const currentAssignment = await CrimvexaAPI.request(
          `/complaints/${encodeURIComponent(item.complaint_id)}/assignment`
        );
        if (requestId !== detailRequest || selected !== complaintId) return;
        assignment.textContent = currentAssignment.assigned_officer
          ? `Assigned to: ${currentAssignment.assigned_officer.full_name}`
          : "Unassigned";
        const assignButton = document.createElement("button");
        assignButton.type = "button";
        assignButton.className = "btn btn-outline";
        assignButton.textContent = "Assign to me";
        assignButton.addEventListener("click", async () => {
          try {
            await CrimvexaAPI.request(`/complaints/${encodeURIComponent(item.complaint_id)}/assignment`, { method: "PUT", body: {} });
            await load();
          } catch (error) { assignment.textContent = error.message; }
        });
        const noteLabel = document.createElement("label");
        noteLabel.textContent = "Internal investigation note";
        const noteInput = document.createElement("textarea");
        noteInput.maxLength = 4000;
        noteInput.setAttribute("aria-label", "Internal investigation note");
        const saveNote = document.createElement("button");
        saveNote.type = "button";
        saveNote.className = "btn btn-outline";
        saveNote.textContent = "Add note";
        const noteStatus = document.createElement("p");
        const notesList = document.createElement("ul");
        const notes = await CrimvexaAPI.request(
          `/complaints/${encodeURIComponent(item.complaint_id)}/notes`
        );
        if (requestId !== detailRequest || selected !== complaintId) return;
        notes.notes.forEach(entry => {
          const row = document.createElement("li");
          row.textContent = `${entry.officer_name} · ${CrimvexaAPI.formatDate(entry.created_at)}: ${entry.note}`;
          notesList.append(row);
        });
        saveNote.addEventListener("click", async () => {
          saveNote.disabled = true;
          try {
            await CrimvexaAPI.request(`/complaints/${encodeURIComponent(item.complaint_id)}/notes`, {
              method: "POST", body: { note: noteInput.value }
            });
            await renderDetail(item, true);
          } catch (error) {
            noteStatus.textContent = error.message;
            saveNote.disabled = false;
          }
        });
        noteLabel.append(noteInput);
        const actions = document.createElement("div");
        actions.className = "actions";
        [["Under Review", "Mark under review"], ["Resolved", "Resolve"]].forEach(([status, label]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "btn btn-primary";
          button.textContent = label;
          button.disabled = item.status === status;
          button.addEventListener("click", async () => {
            button.disabled = true;
            try {
              await CrimvexaAPI.request(`/complaints/${encodeURIComponent(item.complaint_id)}/status`, {
                method: "PATCH", body: { status }
              });
              await load();
            } catch (error) {
              const notice = document.createElement("p");
              notice.textContent = error.message;
              detailPanel.append(notice);
              button.disabled = false;
            }
          });
          actions.append(button);
        });
        detailPanel.append(
          heading, text, location, category, evidence, matchesSection,
          assignment, assignButton,
          noteLabel, saveNote, noteStatus, notesList, actions
        );
      }

      filter.addEventListener("change", () => {
        selected = null;
        load().catch(showLoadError);
      });
      document.getElementById("refreshCases").addEventListener("click", () => {
        load().catch(showLoadError);
      });
      window.setInterval(() => {
        if (document.visibilityState === "visible") {
          load().catch(showLoadError);
        }
      }, 15000);
      await load();
    })().catch(error => {
      document.getElementById("refreshStatus").textContent = "Unable to load workspace";
      document.getElementById("caseList").textContent = error.message;
    });
  </script>
</body>
</html>
