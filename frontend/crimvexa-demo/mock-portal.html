<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Police Portal | CRIMVEXA AI</title>
  <style>
    :root {
      --navy: #0b1120;
      --line: #24345a;
      --muted: #a9b6d3;
      --red: #e5484d;
      --text: #172033;
      --soft: #64748b;
      --paper: #fff;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a { text-decoration: none; color: inherit; }
    header {
      background: #0b1120;
      color: white;
      padding: 14px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { font-weight: 800; }
    .nav { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); }
    .container { max-width: 980px; margin: 30px auto; padding: 0 20px 50px; }
    .banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 14px 18px;
      border-radius: 10px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .panel {
      background: var(--paper);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.05);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      margin-bottom: 12px;
    }
    textarea { min-height: 110px; resize: vertical; }
    .btn {
      display: inline-block;
      padding: 12px 18px;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .status {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #166534;
      padding: 12px 14px;
      border-radius: 8px;
      display: none;
      margin-top: 14px;
    }
    .status.visible { display: block; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">CRIMVEXA AI</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="officer-dashboard.html">Officer</a>
      <a href="citizen-dashboard.html">Citizen</a>
    </nav>
  </header>

  <main class="container">
    <div class="banner">DEMO — NOT AN OFFICIAL POLICE WEBSITE</div>

    <section class="panel">
      <h2>Local mock police filing portal</h2>
      <div class="grid">
        <div>
          <label for="caseSelect">Complaint</label>
          <select id="caseSelect"></select>
          <label for="reporterName">Reporter name</label>
          <input id="reporterName" />
          <label for="location">Location</label>
          <input id="location" />
          <label for="category">Incident category</label>
          <input id="category" />
        </div>
        <div>
          <label for="receiptId">Portal receipt ID</label>
          <input id="receiptId" readonly />
          <label for="status">Portal status</label>
          <input id="status" value="PENDING REVIEW" readonly />
          <label for="summary">Complaint summary</label>
          <textarea id="summary"></textarea>
        </div>
      </div>
      <div style="margin-top: 18px;">
        <button class="btn" id="submitPortal">Submit demo filing</button>
      </div>
      <div id="portalMessage" class="status">Mock filing status will appear here.</div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    (function () {
      const caseSelect = document.getElementById('caseSelect');
      const reporterName = document.getElementById('reporterName');
      const locationInput = document.getElementById('location');
      const categoryInput = document.getElementById('category');
      const summary = document.getElementById('summary');
      const portalMessage = document.getElementById('portalMessage');
      const receiptId = document.getElementById('receiptId');
      const status = document.getElementById('status');
      const params = new URLSearchParams(window.location.search);
      const caseIdFromQuery = params.get('caseId');

      function populateOptions() {
        const cases = window.Crimvexa.loadData().cases;
        caseSelect.innerHTML = cases.map((caseItem) => `<option value="${caseItem.id}">${caseItem.id} • ${caseItem.incidentType}</option>`).join('');
        if (caseIdFromQuery && cases.some((caseItem) => caseItem.id === caseIdFromQuery)) {
          caseSelect.value = caseIdFromQuery;
        }
      }

      function populateSelectedCase() {
        const selected = window.Crimvexa.getCaseById(caseSelect.value);
        if (!selected) return;
        reporterName.value = selected.reporterName || '';
        locationInput.value = selected.location || '';
        categoryInput.value = selected.category || selected.incidentType || '';
        summary.value = selected.description || '';
        receiptId.value = selected.mockPortal ? selected.mockPortal.receipt_id : `MOCK-REC-${Math.floor(Math.random() * 9000 + 1000)}`;
      }

      caseSelect.addEventListener('change', populateSelectedCase);
      document.getElementById('submitPortal').addEventListener('click', () => {
        const selected = window.Crimvexa.getCaseById(caseSelect.value);
        if (!selected) return;
        const receipt = {
          receipt_id: receiptId.value || `MOCK-REC-${Math.floor(Math.random() * 9000 + 1000)}`,
          portal: 'Local Crimvexa Demo Portal',
          confirmed_at: new Date().toISOString(),
          status: 'MOCK_SUBMITTED'
        };
        selected.mockPortal = receipt;
        selected.status = 'UNDER_REVIEW';
        selected.statusHistory = [{ status: 'MOCK_SUBMITTED', timestamp: new Date().toISOString(), actor: 'Portal', note: 'Mock filing confirmed by demo portal.' }, ...(selected.statusHistory || [])];
        window.Crimvexa.addCase(selected);
        status.value = 'SUBMITTED';
        portalMessage.classList.add('visible');
        portalMessage.textContent = `Demo filing accepted. Receipt ID: ${receipt.receipt_id}. This did not notify a real authority.`;
      });

      populateOptions();
      populateSelectedCase();
    })();
  </script>
</body>
</html>
